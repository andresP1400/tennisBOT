name: Weekly Refresh

# Scheduled weekly job: download latest matches, rebuild features,
# retrain pure + odds models for ATP+WTA, settle track predictions.
#
# Manual run: Actions → Weekly Refresh → Run workflow
# Local equivalent: python main.py refresh --tour both --optuna-trials 20

on:
  schedule:
    # Every Monday 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      tour:
        description: "Tour to refresh"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - atp
          - wta
      optuna_trials:
        description: "Optuna trials per model"
        required: false
        default: "20"
      settle_only:
        description: "Only settle track (skip download/train)"
        required: false
        default: false
        type: boolean

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run refresh
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          TOUR="${{ github.event.inputs.tour || 'both' }}"
          TRIALS="${{ github.event.inputs.optuna_trials || '20' }}"
          SETTLE_ONLY="${{ github.event.inputs.settle_only || 'false' }}"
          if [ "$SETTLE_ONLY" = "true" ]; then
            python main.py refresh --tour "$TOUR" --settle-only
          else
            python main.py refresh --tour "$TOUR" --optuna-trials "$TRIALS"
          fi

      - name: Upload models & reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-artifacts
          path: |
            models/saved/
            reports/
            data/processed/
          retention-days: 14
