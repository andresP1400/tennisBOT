<svg width="800" height="140" xmlns="http://www.w3.org/2000/svg">
    <style>
        .title {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 56px;
            font-weight: 800;
            fill: #2563EB; /* Blu */
            text-anchor: middle;
            animation: glow 3s ease-in-out infinite alternate;
        }
        .subtitle {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 20px;
            font-weight: 600;
            fill: #64748B;
            text-anchor: middle;
            letter-spacing: 6px;
            animation: fadeIn 1s ease-out;
        }
        
        @keyframes glow {
            0% { 
                filter: drop-shadow(0 0 5px rgba(37,99,235,0.2)); 
            }
            100% { 
                filter: drop-shadow(0 0 25px rgba(37,99,235,0.9)); 
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    
    <!-- Title -->
    <text x="400" y="75" class="title">TennisBot</text>
    
    <!-- Subtitle -->
    <text x="400" y="115" class="subtitle">ADVANCED ML PREDICTOR</text>
</svg>
