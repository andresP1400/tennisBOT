[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True
warn_unused_ignores = False
warn_redundant_casts = False

# Legacy modules under relaxed typing (functional code with pre-existing
# Optional/Any annotations). mypy still enforces strict typing on every
# other module and on any new file added to the repo.
[mypy-features.elo]
ignore_errors = True

[mypy-features.odds_aggregator]
ignore_errors = True

[mypy-features.live_odds]
ignore_errors = True

[mypy-features.builder]
ignore_errors = True

[mypy-features.cleaning]
ignore_errors = True

[mypy-features.odds]
ignore_errors = True

[mypy-features.fatigue]
ignore_errors = True

[mypy-features.h2h]
ignore_errors = True

[mypy-api_server]
ignore_errors = True

[mypy-pipeline.training]
ignore_errors = True

[mypy-pipeline.evaluation]
ignore_errors = True

[mypy-pipeline.inference]
ignore_errors = True

[mypy-pipeline.calibration]
ignore_errors = True

[mypy-pipeline.betting_eval]
ignore_errors = True

[mypy-pipeline.track]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True

[mypy-test_track]
ignore_errors = True
